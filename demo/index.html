<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cron Console Demo</title>
    <meta name="color-scheme" content="dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --font-sans: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        --color-bg: #000000;
        --color-surface: #09090b;
        --color-surface-elevated: rgba(16, 16, 20, 0.9);
        --color-text-strong: #f5f5f5;
        --color-text-primary: #d4d4d8;
        --color-text-muted: #a1a1aa;
        --color-text-subtle: #71717a;
        --color-border-soft: #18181b;
        --color-border-strong: #3f3f46;
        --color-outline: #a1a1aa;
        --color-danger: #f87171;
        --color-success: #4ade80;
        --color-warning: #facc15;
        --shadow-soft: 0 32px 80px rgba(0, 0, 0, 0.45);
      }

      * {
        box-sizing: border-box;
      }

      html {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top, rgba(11, 17, 32, 0.72), transparent 34%),
          radial-gradient(circle at 20% 20%, rgba(63, 63, 70, 0.16), transparent 28%),
          linear-gradient(180deg, #050505 0%, #000000 100%);
        color: var(--color-text-primary);
        font-family: var(--font-mono);
      }

      button,
      input {
        font: inherit;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .shell {
        width: min(100%, 46rem);
        margin: 0 auto;
        padding: 4rem 1.25rem 3rem;
      }

      .breadcrumb {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 1.75rem;
        font-size: 0.75rem;
        color: var(--color-text-muted);
      }

      .breadcrumb__prompt {
        color: var(--color-text-subtle);
      }

      .breadcrumb__path {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .hero {
        margin-bottom: 4rem;
      }

      .hero__title {
        margin: 0;
        font-family: var(--font-sans);
        font-size: clamp(2.7rem, 8vw, 3.8rem);
        line-height: 1;
        letter-spacing: -0.04em;
        color: var(--color-text-strong);
      }

      .hero__subtitle {
        margin: 0.55rem 0 0;
        font-size: 0.98rem;
        line-height: 1.6;
        color: var(--color-text-muted);
      }

      .page-sections {
        display: grid;
        gap: 3.5rem;
      }

      .section {
        display: grid;
        gap: 1rem;
      }

      .section__header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
      }

      .section__title {
        margin: 0;
        font-family: var(--font-sans);
        font-size: 1.05rem;
        font-weight: 600;
        color: var(--color-text-strong);
      }

      .section__meta {
        margin: 0.25rem 0 0;
        font-size: 0.8rem;
        line-height: 1.5;
        color: var(--color-text-subtle);
      }

      .action-link {
        appearance: none;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--color-text-primary);
        text-decoration: underline;
        text-decoration-style: dotted;
        text-underline-offset: 0.32rem;
        transition: color 150ms ease, opacity 150ms ease;
      }

      .action-link:hover:not(:disabled) {
        color: var(--color-text-strong);
      }

      .action-link:focus-visible {
        outline: 1px solid var(--color-outline);
        outline-offset: 4px;
      }

      .action-link:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .tree {
        position: relative;
        padding-left: 1.55rem;
      }

      .tree::before {
        content: "";
        position: absolute;
        top: 0.15rem;
        bottom: 0.15rem;
        left: 0.45rem;
        width: 1px;
        background: var(--color-border-strong);
      }

      .tree__item {
        position: relative;
        padding-left: 1.55rem;
      }

      .tree__item::before {
        content: "";
        position: absolute;
        top: 1.1rem;
        left: 0;
        width: 0.8rem;
        height: 1px;
        background: var(--color-border-strong);
      }

      .tree__item:last-child::after {
        content: "";
        position: absolute;
        top: 1.15rem;
        bottom: 0;
        left: -1.1rem;
        width: 1px;
        background: var(--color-bg);
      }

      .label {
        display: block;
        margin-bottom: 0.55rem;
        font-size: 0.78rem;
        color: var(--color-text-muted);
      }

      .prompt-form {
        display: grid;
        gap: 0.7rem;
      }

      .prompt-row,
      .output-row {
        display: flex;
        align-items: center;
        gap: 0.9rem;
        min-height: 2.4rem;
      }

      .input-field-wrap {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex: 1;
        min-height: 3.15rem;
        padding: 0 0.9rem;
        border-bottom: 1px solid var(--color-border-strong);
        background: rgba(255, 255, 255, 0.01);
        transition: border-color 150ms ease, background-color 150ms ease;
      }

      .input-field-wrap:focus-within {
        border-color: var(--color-text-primary);
        background: rgba(255, 255, 255, 0.025);
      }

      .input-field-wrap__prompt {
        flex: 0 0 auto;
        color: var(--color-text-subtle);
      }

      .input-field-wrap input {
        width: 100%;
        border: 0;
        outline: none;
        background: transparent;
        color: var(--color-text-strong);
        font-size: 1rem;
        line-height: 1.6;
      }

      .input-field-wrap input::placeholder {
        color: #666b75;
      }

      .dash {
        flex: 1;
        min-width: 2.5rem;
        border-bottom: 1px dashed var(--color-border-strong);
        transform: translateY(0.1rem);
      }

      .button {
        appearance: none;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--color-text-primary);
        text-decoration: underline;
        text-decoration-style: dotted;
        text-underline-offset: 0.32rem;
        transition: color 150ms ease, opacity 150ms ease;
      }

      .button:hover:not(:disabled) {
        color: var(--color-text-strong);
      }

      .button:focus-visible {
        outline: 1px solid var(--color-outline);
        outline-offset: 4px;
      }

      .button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .prompt-actions {
        display: flex;
        justify-content: flex-end;
      }

      .output-block {
        display: grid;
        gap: 0.7rem;
      }

      .output-row {
        align-items: stretch;
      }

      .output-actions {
        display: flex;
        justify-content: flex-end;
      }

      .result-shell {
        width: 100%;
        min-height: 3.15rem;
        padding: 0.85rem 1rem;
        border-bottom: 1px solid var(--color-border-strong);
        background: rgba(255, 255, 255, 0.01);
      }

      .result__value {
        min-height: 1.5rem;
        margin: 0;
        overflow-x: auto;
        white-space: pre-wrap;
        word-break: break-word;
        color: var(--color-text-strong);
        font-size: clamp(1.05rem, 3vw, 1.35rem);
        line-height: 1.6;
      }

      .result__value.is-placeholder,
      .result__value.is-error {
        font-size: 1rem;
        line-height: 1.6;
      }

      .result__value.is-placeholder {
        color: var(--color-text-subtle);
      }

      .result__value.is-error,
      .result__value.is-invalid {
        color: var(--color-danger);
      }

      .input-hint {
        margin: 0.65rem 0 0;
        font-size: 0.78rem;
        line-height: 1.6;
        color: var(--color-text-subtle);
      }

      @media (max-width: 640px) {
        .shell {
          padding-top: 3rem;
        }

        .section__header,
        .prompt-row,
        .output-row {
          flex-direction: column;
          align-items: stretch;
        }

        .dash {
          display: none;
        }

        .prompt-actions {
          justify-content: flex-start;
        }

        .output-actions {
          justify-content: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <span class="breadcrumb__prompt">$</span>
        <span class="breadcrumb__path" data-breadcrumb-path>/home/dev/cron-finetuning/demo</span>
      </nav>

      <header class="hero">
        <h1 data-app-title class="hero__title">Cron Console</h1>
        <p data-app-subtitle class="hero__subtitle">(English) to Cron.</p>
      </header>

      <main class="page-sections">
        <section class="section">
          <div class="section__header">
            <div>
              <h2 class="section__title">Prompt</h2>
              <p class="section__meta">Enter a scheduling request in plain English.</p>
            </div>
          </div>

          <div data-prompt-form class="prompt-form">
            <label class="label" for="cron-prompt">Scheduling request</label>
            <div class="prompt-row">
              <div class="input-field-wrap">
                <span class="input-field-wrap__prompt">&gt;</span>
                  <input
                    id="cron-prompt"
                    data-prompt-input
                    type="text"
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="Every weekday at 9:00"
                  />
              </div>
            </div>
            <div class="prompt-actions">
              <button type="button" data-run class="button">Generate</button>
            </div>
            <p class="input-hint">Press Enter or click Generate.</p>
          </div>
        </section>

        <section class="section" aria-live="polite" aria-labelledby="result-heading">
          <div class="section__header">
            <div>
              <h2 id="result-heading" class="section__title">Output</h2>
              <p class="section__meta">The model returns a cron expression or `INVALID`.</p>
            </div>
          </div>

          <div class="output-block">
            <div class="output-row">
              <div class="result-shell">
                <pre data-normalized-output class="result__value is-placeholder">Ready for a prediction.</pre>
              </div>
            </div>
            <div class="output-actions">
              <button type="button" data-copy class="button">Copy</button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="./config.js?v=2"></script>
    <script type="module" src="./app.js?v=4"></script>
  </body>
</html>
