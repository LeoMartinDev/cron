[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cron-finetuning"
version = "0.1.0"
description = "Dataset generation and fine-tuning for cron expression models"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Leo" },
]
keywords = ["cron", "nlp", "fine-tuning", "dataset", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "huggingface-hub>=0.26",
    "datasets>=3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
generate = [
    "huggingface-hub>=0.26",
    "datasets>=3.0",
]
train = [
    "unsloth>=2024.12",
    "transformers>=4.46",
    "datasets>=3.0",
    "accelerate>=1.0",
    "bitsandbytes>=0.44",
    "trl>=0.12",
]
inference = [
    "unsloth>=2024.12",
    "transformers>=4.46",
    "accelerate>=1.0",
    "bitsandbytes>=0.44",
]
evaluate = [
    "unsloth>=2024.12",
    "transformers>=4.46",
    "accelerate>=1.0",
    "bitsandbytes>=0.44",
    "datasets>=3.0",
]
all = [
    "huggingface-hub>=0.26",
    "datasets>=3.0",
    "unsloth>=2024.12",
    "transformers>=4.46",
    "accelerate>=1.0",
    "bitsandbytes>=0.44",
    "trl>=0.12",
]

[project.scripts]
cron-generate = "scripts.generate:main"
cron-train = "scripts.train:main"
cron-inference = "scripts.inference:main"
cron-evaluate = "scripts.evaluate:main"

[project.urls]
Homepage = "https://github.com/user/cron-finetuning"
Repository = "https://github.com/user/cron-finetuning"

# ── Linting & formatting ──────────────────────────────────────────────

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes (unused imports, undefined names, etc.)
    "I",     # isort (import ordering)
    "N",     # pep8-naming
    "UP",    # pyupgrade (modern syntax)
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # Ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["cron_finetuning", "scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ── Type checking ─────────────────────────────────────────────────────

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
include = ["src", "scripts"]
exclude = ["**/__pycache__", "dist", "build", ".venv", "_unsloth_sentencepiece_temp", "unsloth_compiled_cache"]
reportMissingImports = true
reportMissingTypeStubs = false
reportPrivateUsage = false

[tool.basedpyright]
# If you switch to basedpyright, it reads the same [tool.pyright] section.
# basedpyright is a fork of pyright with better defaults for non-Microsoft users.
# To use: uvx basedpyright src/ scripts/

# ── Type checker (mypy) ───────────────────────────────────────────────

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
mypy_path = "src"

[tool.hatch.build.targets.wheel]
packages = ["src/cron_finetuning", "scripts"]

[tool.hatch.build.targets.sdist]
include = [
    "src/cron_finetuning/**/*.py",
    "scripts/**/*.py",
    "README.md",
    "pyproject.toml",
]
